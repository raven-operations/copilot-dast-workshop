# Docker Compose para el laboratorio "GitHub Copilot + OWASP ZAP (DAST)".
#
# Etapa 1: únicamente se levanta la aplicación vulnerable OWASP Juice Shop.
# En etapas posteriores del workshop se añadirá el servicio de OWASP ZAP.

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: unsafe
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/rest/admin/application-version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dast-lab

networks:
  dast-lab:
    driver: bridge
