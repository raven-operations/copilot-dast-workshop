# Workflow DAST: escanea las apps vulnerables del laboratorio con OWASP ZAP.
#
# Estrategia (matrix):
#   Para cada target (juice-shop, vulnerable-api) en paralelo:
#     1. Levanta el servicio con Docker Compose.
#     2. Espera al healthcheck.
#     3. Ejecuta zaproxy/action-baseline (o action-full-scan según input).
#     4. Sube los reportes como artifact independiente.
#
# El escaneo no bloquea el pipeline por hallazgos (`-I` en cmd_options)
# para no romper PRs; en un pipeline productivo real esto se ajusta.

name: dast

on:
  workflow_dispatch:
    inputs:
      target:
        description: "App(s) a escanear"
        required: true
        default: all
        type: choice
        options:
          - all
          - juice-shop
          - vulnerable-api
      scan_type:
        description: "Tipo de escaneo a ejecutar"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - full
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "zap/**"
      - "app-vulnerable-api/**"
      - ".github/workflows/dast.yml"
  schedule:
    # Todos los lunes a las 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  # Necesario si en el futuro publicamos SARIF a la pestaña Security.
  security-events: write
  # La acción de ZAP puede abrir un issue con el resumen; requiere este permiso.
  issues: write

jobs:
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          TARGET_INPUT: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -euo pipefail
          juice='{"name":"juice-shop","service":"juice-shop","url":"http://localhost:3000"}'
          vuln='{"name":"vulnerable-api","service":"vulnerable-api","url":"http://localhost:4000"}'
          case "${TARGET_INPUT}" in
            juice-shop)     matrix="{\"target\":[${juice}]}" ;;
            vulnerable-api) matrix="{\"target\":[${vuln}]}" ;;
            *)              matrix="{\"target\":[${juice},${vuln}]}" ;;
          esac
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: ${matrix}"

  zap-scan:
    name: "ZAP ${{ matrix.target.name }}"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      SCAN_TYPE: ${{ github.event.inputs.scan_type || 'baseline' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ${{ matrix.target.service }}
        run: docker compose up -d --build ${{ matrix.target.service }}

      - name: Wait for ${{ matrix.target.service }} to be healthy
        run: |
          set -euo pipefail
          for i in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "${{ matrix.target.service }}" 2>/dev/null || echo "starting")
            echo "attempt $i - health: $status"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::${{ matrix.target.service }} no alcanzó estado healthy"
          docker compose logs "${{ matrix.target.service }}"
          exit 1

      - name: Run ZAP baseline scan
        if: env.SCAN_TYPE == 'baseline'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ matrix.target.url }}
          rules_file_name: zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-${{ matrix.target.name }}

      - name: Run ZAP full scan
        if: env.SCAN_TYPE == 'full'
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ matrix.target.url }}
          rules_file_name: zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-full-${{ matrix.target.name }}

      - name: Show ${{ matrix.target.service }} logs (on failure)
        if: failure()
        run: docker compose logs "${{ matrix.target.service }}"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
