# Workflow de validacion basico del workshop.
#
# En esta etapa NO se ejecutan escaneos DAST ni analisis de seguridad.
# Solo se valida que la estructura del repositorio y el docker-compose
# esten correctos.

name: validate-lab

on:
  push:
    branches: [main, main-copilot-workshop]
  pull_request:
    branches: [main, main-copilot-workshop]
  workflow_dispatch:

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "about.md"
            "LICENSE"
            ".gitignore"
            "docker-compose.yml"
            "scripts/start.sh"
            "scripts/stop.sh"
            "scripts/cleanup.sh"
            "scripts/scan.sh"
            "scripts/start.ps1"
            "scripts/stop.ps1"
            "scripts/cleanup.ps1"
            "scripts/scan.ps1"
            "zap/rules.tsv"
            ".github/workflows/_dast-reusable.yml"
            ".github/workflows/dast-juice-shop.yml"
            ".github/workflows/dast-vulnerable-api.yml"
            "proxy/Caddyfile"
            "app-vulnerable-api/package.json"
            "app-vulnerable-api/package-lock.json"
            "app-vulnerable-api/Dockerfile"
            "app-vulnerable-api/src/server.js"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::Missing required file: $f"
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            exit 1
          fi
          echo "All required files are present."

      - name: Validate docker-compose syntax
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check pinned image tags (no moving tags)
        shell: bash
        run: |
          set -euo pipefail
          # Un workshop reproducible no puede depender de tags moviles
          # (latest, stable, edge). Ver about.md § "Politica de reproducibilidad".
          if grep -EHn 'image:\s*\S+:(latest|stable|edge)\b' docker-compose.yml; then
            echo "::error::Se detectaron tags moviles en docker-compose.yml"
            exit 1
          fi
          echo "OK: todas las imagenes estan pineadas."

      - name: Verify lockfile is in sync
        working-directory: app-vulnerable-api
        # 'npm ci' falla si package.json y package-lock.json estan desincronizados.
        # --dry-run evita instalar; solo valida.
        run: npm ci --omit=dev --dry-run
