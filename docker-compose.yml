# Docker Compose para el laboratorio "GitHub Copilot + OWASP ZAP (DAST)".
#
# Servicios:
#   - juice-shop     : app vulnerable de terceros (imagen inmutable).
#                      Sirve para el enfoque "remediación sin acceso al código"
#                      (mitigación con reverse proxy).
#   - vulnerable-api : app propia Node.js con vulnerabilidades canónicas
#                      (SQLi, XSS, cmd injection, path traversal). Sirve para
#                      el enfoque "remediación en el código" con Copilot.
#   - proxy          : reverse proxy Caddy que inyecta security headers.
#                      Se activa con el perfil "hardened" (etapa de remediación).
#   - zap            : escáner OWASP ZAP, se activa bajo demanda con el perfil
#                      "scan" (docker compose --profile scan run --rm zap).

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: unsafe
    healthcheck:
      # La imagen de juice-shop es distroless y node no está en el PATH;
      # invocamos el binario por su ruta absoluta.
      test:
        - "CMD"
        - "/nodejs/bin/node"
        - "-e"
        - "require('http').get('http://localhost:3000/rest/admin/application-version', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dast-lab

  vulnerable-api:
    build: ./app-vulnerable-api
    container_name: vulnerable-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dast-lab

  proxy:
    image: caddy:2-alpine
    container_name: proxy
    profiles: ["hardened"]
    depends_on:
      juice-shop:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - dast-lab

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    profiles: ["scan"]
    depends_on:
      juice-shop:
        condition: service_healthy
    volumes:
      - ./reports:/zap/wrk:rw
      - ./zap:/zap/config:ro
    networks:
      - dast-lab
    # Escaneo baseline (pasivo, rápido). Se puede sobreescribir con:
    #   docker compose --profile scan run --rm zap zap-full-scan.py ...
    command: >
      zap-baseline.py
      -t http://juice-shop:3000
      -c /zap/config/rules.tsv
      -r zap-baseline-report.html
      -J zap-baseline-report.json
      -w zap-baseline-report.md
      -I

networks:
  dast-lab:
    driver: bridge
