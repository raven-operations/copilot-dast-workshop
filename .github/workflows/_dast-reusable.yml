# Reusable workflow: escanea una app del laboratorio con OWASP ZAP.
#
# No se ejecuta por sí solo; se invoca desde workflows específicos
# por app (dast-juice-shop.yml, dast-vulnerable-api.yml) para que cada
# app tenga su propio badge de estado.
#
# Pasos:
#   1. Levanta el servicio con Docker Compose.
#   2. Espera al healthcheck.
#   3. Ejecuta zaproxy/action-baseline o action-full-scan.
#   4. Sube los reportes como artifact.
#
# El escaneo no bloquea el pipeline por hallazgos (`-I` en cmd_options)
# para no romper PRs; en un pipeline productivo real esto se ajusta.

name: _dast-reusable

on:
  workflow_call:
    inputs:
      target_name:
        description: "Nombre corto del target (usado en artifact y job name)."
        required: true
        type: string
      target_service:
        description: "Nombre del servicio en docker-compose.yml."
        required: true
        type: string
      target_url:
        description: "URL contra la que apunta ZAP."
        required: true
        type: string
      scan_type:
        description: "baseline o full."
        required: false
        type: string
        default: baseline

jobs:
  zap-scan:
    name: "ZAP ${{ inputs.target_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      # Necesario si en el futuro publicamos SARIF a la pestaña Security.
      security-events: write
      # La acción de ZAP puede abrir un issue con el resumen; requiere este permiso.
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ${{ inputs.target_service }}
        run: docker compose up -d --build ${{ inputs.target_service }}

      - name: Wait for ${{ inputs.target_service }} to be healthy
        run: |
          set -euo pipefail
          for i in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "${{ inputs.target_service }}" 2>/dev/null || echo "starting")
            echo "attempt $i - health: $status"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::${{ inputs.target_service }} no alcanzó estado healthy"
          docker compose logs "${{ inputs.target_service }}"
          exit 1

      - name: Run ZAP baseline scan
        if: inputs.scan_type == 'baseline'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
          fail_action: false
          # Pin exacto de la imagen para builds reproducibles.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          artifact_name: zap-baseline-${{ inputs.target_name }}

      - name: Run ZAP full scan
        if: inputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
          fail_action: false
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          artifact_name: zap-full-${{ inputs.target_name }}

      - name: Convert ZAP JSON to SARIF (full scan only)
        if: inputs.scan_type == 'full'
        # Convierte el reporte JSON de OWASP ZAP a SARIF 2.1.0 para que
        # `github/codeql-action/upload-sarif@v3` pueda publicarlo como
        # Code Scanning Alerts en la pestana Security del repositorio.
        #
        # Mapeo de severidad ZAP -> SARIF:
        #   riskcode 3 (High)   -> level=error   security-severity=8.5
        #   riskcode 2 (Medium) -> level=warning security-severity=6.5
        #   riskcode 1 (Low)    -> level=warning security-severity=3.5
        #   riskcode 0 (Info)   -> level=note    security-severity=1.0
        #
        # No instala dependencias: usa solo la stdlib de Python 3 que
        # viene preinstalada en ubuntu-latest.
        run: |
          set -euo pipefail
          if [[ ! -f report_json.json ]]; then
            echo "::warning::report_json.json no existe; nada que convertir a SARIF."
            exit 0
          fi
          python3 - <<'PYEOF'
          import json, pathlib

          RISK_TO_LEVEL = {"0": "note", "1": "warning", "2": "warning", "3": "error"}
          RISK_TO_SEV   = {"0": "1.0",  "1": "3.5",     "2": "6.5",     "3": "8.5"}

          zap = json.loads(pathlib.Path("report_json.json").read_text())
          rules_by_id = {}
          results = []

          for site in zap.get("site", []):
              for alert in site.get("alerts", []):
                  rid = f"zap-{alert.get('pluginid', 'unknown')}"
                  riskcode = str(alert.get("riskcode", "0"))
                  level = RISK_TO_LEVEL.get(riskcode, "note")
                  sev = RISK_TO_SEV.get(riskcode, "0.0")

                  if rid not in rules_by_id:
                      rules_by_id[rid] = {
                          "id": rid,
                          "name": (alert.get("alert") or "ZAP alert")[:200],
                          "shortDescription": {"text": (alert.get("alert") or "")[:200]},
                          "fullDescription": {"text": (alert.get("desc") or "")[:1000]},
                          "help": {"text": (alert.get("solution") or "See ZAP documentation.")[:1000]},
                          "defaultConfiguration": {"level": level},
                          "properties": {
                              "security-severity": sev,
                              "tags": ["security", "dast", "owasp-zap"],
                          },
                          "helpUri": f"https://www.zaproxy.org/docs/alerts/{alert.get('pluginid', '')}/",
                      }

                  for inst in alert.get("instances", []):
                      results.append({
                          "ruleId": rid,
                          "level": level,
                          "message": {"text": f"{alert.get('alert', '')} on {inst.get('uri', '')}"},
                          "locations": [{
                              "physicalLocation": {
                                  "artifactLocation": {"uri": inst.get("uri", "")}
                              }
                          }],
                      })

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "OWASP ZAP",
                          "informationUri": "https://www.zaproxy.org/",
                          "rules": list(rules_by_id.values()),
                      }
                  },
                  "results": results,
              }],
          }
          pathlib.Path("zap.sarif").write_text(json.dumps(sarif, indent=2))
          print(f"::notice::Generado zap.sarif con {len(rules_by_id)} reglas y {len(results)} findings.")
          PYEOF

      - name: Upload SARIF to Code Scanning (full scan only)
        if: inputs.scan_type == 'full'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zap.sarif
          # `category` permite que multiples wrappers (dast-juice-shop,
          # dast-vulnerable-api) publiquen sus propios findings sin
          # sobrescribirse mutuamente en la pestana Security.
          category: dast-${{ inputs.target_name }}

      - name: Show ${{ inputs.target_service }} logs (on failure)
        if: failure()
        run: docker compose logs "${{ inputs.target_service }}"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
